# @package _global_

# module: # a test setup; ignore this
#   _target_: emg2qwerty.lightning.MyTestofTDSConvCTCModule
#   in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
#   mlp_features: [384]
#   block_channels: [24, 24, 24, 24]
#   kernel_width: 32  # Total temporal receptive field of 125 samples given 4 layers

module:
  _target_: emg2qwerty.lightning.MambaCTCModule
  in_features: 528
  mlp_features: [384]
  num_layers: 4
  d_state: 128
  headdim: 64
  expand: 2
  crop_left: 112 # bidirectional: keep the labelled region
  crop_right: 12 # forward-only runs override these to 124 and 0
  bidirectional: true

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
